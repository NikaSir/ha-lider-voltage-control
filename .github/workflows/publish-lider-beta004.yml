name: Publish authorized LIDER beta004
on:
  push:
    branches: [release/publish-lider-beta004]
    paths: [.github/workflows/publish-lider-beta004.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.actor == 'NikaSir' && github.repository == 'NikaSir/ha-lider-voltage-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a1e653b75d2ff78799fed219d173a99a407ff1dd
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = a1e653b75d2ff78799fed219d173a99a407ff1dd
          node scripts/build-frontend-bundle.mjs --check
          node scripts/check-stable-dom.mjs
          node scripts/check-overview-header-composition.mjs
          node scripts/check-refresh-action.mjs
          python3 scripts/check-nikas-ui-standard.py
          git diff --exit-code
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = "NikaSir/ha-lider-voltage-control"
          sha = "a1e653b75d2ff78799fed219d173a99a407ff1dd"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == sha
          component = Path("custom_components/lider_voltage_control")
          tag = json.loads((component / "manifest.json").read_text())["version"]
          ui = json.loads((component / "panel_manifest.json").read_text())["ui_version"]
          assert (tag, ui) == ("0.8.12-beta004", "0.8.14")

          def api(path, data=None, allow_missing=False):
              request = Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urlopen(request, timeout=35) as response:
                      return json.load(response)
              except HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise

          assert api("/git/ref/heads/main")["object"]["sha"] == sha, "Main has moved"
          required = {
              "Repository checks": {"validate"},
              "Integration validation": {"HACS", "Hassfest"},
          }
          runs = api("/actions/runs?event=push&head_sha=" + sha + "&per_page=100")["workflow_runs"]
          for workflow, required_jobs in required.items():
              matching = [
                  run for run in runs
                  if run["head_sha"] == sha and run["head_branch"] == "main"
                  and run["event"] == "push" and run["name"] == workflow
              ]
              assert matching, f"Missing main CI run for {workflow}"
              run = max(matching, key=lambda item: item["id"])
              assert (run["status"], run["conclusion"]) == ("completed", "success"), workflow
              jobs = api(f"/actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
              completed = {job["name"] for job in jobs if job["status"] == "completed" and job["conclusion"] == "success"}
              assert required_jobs <= completed, (workflow, required_jobs - completed)
              print("VERIFIED MAIN CI", workflow, run["html_url"])

          tag_path = "/git/ref/tags/" + tag
          tag_ref = api(tag_path, allow_missing=True)
          release = api("/releases/tags/" + tag, allow_missing=True)
          if tag_ref is None:
              assert release is None, "Existing release has no tag"
              tag_ref = api("/git/refs", {"ref": "refs/tags/" + tag, "sha": sha})
          target = tag_ref["object"]
          while target["type"] == "tag":
              target = api("/git/tags/" + target["sha"])["object"]
          assert target["type"] == "commit" and target["sha"] == sha, "Tag points to a different commit"

          if release is None:
              release = api("/releases", {
                  "tag_name": tag,
                  "target_commitish": sha,
                  "name": tag + " / UI " + ui,
                  "body": "## Электросеть · UI 0.8.14\n\n- Тёмная тема получила контрастные подписи и показания фазовых карточек.\n- Шапка NikaS показывает полные версии UI и интеграции в одной строке. Цвет стрелки обновления соответствует активной теме.\n- Два компактных значка показывают связь с входным измерителем и свежесть напряжений A/B/C. Текст обоих статусов доступен в диагностике.\n\nПроверки validate, HACS и Hassfest прошли на исходном коммите. Проверка на iPhone в рабочем Home Assistant предстоит.\n\n[PR №61](https://github.com/NikaSir/ha-lider-voltage-control/pull/61)",
                  "draft": False,
                  "prerelease": True,
                  "make_latest": "false",
              })
          assert release["tag_name"] == tag and release["prerelease"] is True and release["draft"] is False
          assert release["published_at"], "Release is not published"
          print("PUBLISHED", release["html_url"], "COMMIT", sha, "UI", ui)
          PY
