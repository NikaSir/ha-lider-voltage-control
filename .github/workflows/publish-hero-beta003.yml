name: Publish authorized HERO beta003
on:
  push:
    branches: [release/publish-hero-beta003]
    paths: [.github/workflows/publish-hero-beta003.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.actor == 'NikaSir' && github.repository == 'NikaSir/ha-lider-voltage-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b7c3cadd22054e82e336703e6fe979ecd6c20499
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = b7c3cadd22054e82e336703e6fe979ecd6c20499
          node scripts/build-frontend-bundle.mjs --check
          python3 scripts/check-nikas-ui-standard.py
          python3 tests/test_hero_surface.py
          node --check custom_components/lider_voltage_control/frontend/lider-voltage-control-panel.js
          git diff --exit-code
      - name: Publish prerelease without replacing stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = 'NikaSir/ha-lider-voltage-control'
          sha = 'b7c3cadd22054e82e336703e6fe979ecd6c20499'
          tag, ui = '0.8.12-beta003', '0.8.13'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == sha
          assert json.loads(Path('custom_components/lider_voltage_control/manifest.json').read_text())['version'] == tag
          assert json.loads(Path('.nikas-ui-standard.json').read_text())['ui_version'].removeprefix('v') == ui
          def api(path, data=None, allow_missing=False):
              request = Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28',
                           'Content-Type':'application/json'})
              try:
                  with urlopen(request,timeout=45) as response:
                      return json.load(response)
              except HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise
          assert api('/git/ref/heads/main')['object']['sha'] == sha, 'Main moved; review before publishing'
          runs = api('/actions/runs?event=push&head_sha=' + sha + '&per_page=100')['workflow_runs']
          required = {'Repository checks','HERO surface regression','Integration validation'}
          latest = {}
          for run in runs:
              if run['head_branch'] == 'main' and run['head_sha'] == sha and run['name'] in required:
                  if run['name'] not in latest or run['id'] > latest[run['name']]['id']:
                      latest[run['name']] = run
          assert set(latest) == required, 'Missing main CI runs'
          for name, run in latest.items():
              assert run['status'] == 'completed' and run['conclusion'] == 'success', (name,run['status'],run['conclusion'])
              print('VERIFIED MAIN CI', name, run['html_url'])
          release = api('/releases/tags/' + tag,allow_missing=True)
          if release is None:
              assert api('/git/ref/tags/' + tag,allow_missing=True) is None, 'Existing tag must not be overwritten'
              body = 'Равномерная подложка HERO: 95% фона карточки + 5% акцентного цвета, без градиента.\n\nФото стойки, декоративный круг, компоновка и телеметрия не изменены. UI 0.8.13: обновлены версии загрузки интерфейса.\n\nПроверены production-сборка, HERO regression и CI в main. Визуальная проверка на телефоне — после установки. Stable-релиз не заменяется.'
              release = api('/releases', {'tag_name':tag,'target_commitish':sha,'name':tag + ' / UI ' + ui,'body':body,'draft':False,'prerelease':True,'make_latest':'false'})
          assert release['tag_name'] == tag and release['prerelease'] is True and release['draft'] is False
          target = api('/git/ref/tags/' + tag)['object']
          if target['type'] == 'tag':
              target = api('/git/tags/' + target['sha'])['object']
          assert target['type'] == 'commit' and target['sha'] == sha, 'Release tag differs from verified main'
          print('PUBLISHED', release['html_url'], 'COMMIT', sha, 'UI', ui)
          PY
