name: Prepare authorized beta003
on:
  push:
    branches: [release/hero-surface-beta003]
    paths: [.github/workflows/prepare-beta003.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'NikaSir' && github.ref == 'refs/heads/release/hero-surface-beta003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize release metadata and build
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          manifests = list(Path('custom_components').glob('*/manifest.json'))
          assert len(manifests) == 1
          manifest = manifests[0]
          component = manifest.parent
          old = json.loads(manifest.read_text())['version']
          assert old.endswith('-beta002'), old
          new = old[:-3] + '003'
          standard = Path('.nikas-ui-standard.json')
          oldui = json.loads(standard.read_text())['ui_version'].removeprefix('v')
          parts = oldui.split('.')
          assert len(parts) == 3 and all(p.isdigit() for p in parts)
          newui = '.'.join(parts[:2] + [str(int(parts[2]) + 1)])
          pattern = re.compile(r'(?<![0-9.])' + re.escape(oldui) + r'(?![0-9A-Za-z.\-])')
          builders = [('python3','scripts/build_s8_production.py'),('python3','scripts/build-frontend.py'),('node','scripts/build-frontend-bundle.mjs')]
          builds = [list(b) for b in builders if Path(b[1]).is_file()]
          assert len(builds) <= 1
          candidates = list(component.glob('*.py')) + list((component/'frontend').glob('*.js')) + list((component/'frontend').glob('*.mjs'))
          candidates += [manifest, standard, Path('panel.json'), Path('panel_manifest.json')]
          generated = {'s8-omni-production.js','nikas-climate-production.js','lider-voltage-control-panel.js'}
          changes = []
          for p in candidates:
            if not p.is_file() or p.name in generated:
              continue
            before = p.read_text(encoding='utf-8')
            after = pattern.sub(newui, before.replace(old,new))
            if after != before:
              p.write_text(after,encoding='utf-8')
              changes.append(str(p))
          assert str(manifest) in changes and str(standard) in changes
          for build in builds:
            subprocess.run(build,check=True)
            subprocess.run(build + ['--check'],check=True)
          subprocess.run(['python3','tests/test_hero_surface.py'],check=True)
          subprocess.run(['python3','scripts/check_nikas_ui_standard.py'],check=True)
          subprocess.run(['python3','-m','compileall','-q','custom_components'],check=True)
          for p in (component/'frontend').iterdir():
            if p.suffix in ('.js','.mjs'):
              subprocess.run(['node','--check',str(p)],check=True)
          actual = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p in changes or Path(p).name in generated for p in actual), actual
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*actual],check=True)
          subprocess.run(['git','commit','-m',f'chore(release): {new}, UI {newui} cache refresh'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/release/hero-surface-beta003'],check=True)
          PY
