api_version: nikas.home-assistant/lider-panel-contract/v2
kind: LiderVoltageControlContract
metadata:
  id: lider.voltage_control
  title: Электросеть
  version: 0.9.0
spec:
  read_only: true
  standards:
    ui: NikaS Specialized Panel UI Standard v1.9
    navigation: NikaS Panel Navigation and Return Contract v1.1
    engineering_knowledge: NIKAS_ENGINEERING_KNOWLEDGE_BASE.md
    proven_patterns: NIKAS_PROVEN_INTEGRATION_PANEL_PATTERNS.md
  architecture:
    clean_rewrite: true
    legacy_frontend_reused: false
    layers: [DataAdapter, HistoryStore, ViewStore, LiderVoltageControlPanel]
    data_to_dom: targeted_patch_only
    views: lazy_create_cache_reattach
  rendering:
    stable_shell_dom: true
    shadow_root_inner_html: initial_mount_only
    telemetry_updates: patch_existing_nodes
    update_coalescing: one_animation_frame
    status_updates: targeted_patch_only
    unknown_unavailable: explicit_no_data
    preserve_on_update: [header, image, zoom_viewport, scroll, bottom_tab_bar]
    structural_render_during_scroll: false
    production_bundle: self_contained
    runtime_module_imports: false
    phone_shell: three_row_grid
    outer_document_scroll: false
    work_viewport_scroll_chaining: false
  navigation:
    primary_tabs: [overview, before, after, history, diagnostics]
    bottom_tab_columns: 5
    bottom_icon_px: 28
    bottom_label_px: 12
    diagnostics_visible_label: Диагн.
    diagnostics_accessible_label: Диагностика
    return_route:
      capture_once: true
      explicit_precedence: [return_to, from]
      handoff_keys: [nikas.specialized.source_route.v1, nikas.specialized.source_route_at.v1]
      handoff_max_age_ms: 30000
      handoff_consumed_once: true
      normalize_base_routes: true
      history_back_allowed: false
      safe_default: /dashboard-infrastructure/overview
  gestures:
    pinch_range_percent: [75, 200]
    snap_to_100_percent: [97, 103]
    two_finger_double_tap_reset: true
    one_finger_pan_above_100_percent_only: true
    native_vertical_scroll_at_100_percent: true
    persistent_per_client: true
    suppress_post_gesture_click: true
  equipment:
    three_phase_assembly: three LIDER PS-7500W-30 modules
    phase_module: LIDER PS-7500W-30
    module_count: 3
    rack: communication_rack_with_manual_phase_bypass
    bypass: manual_per_phase
  overview:
    flow_caption: Сеть → LIDER → дом
    localized_units: {V: В, A: А, W: Вт, Hz: Гц, kWh: kWh}
  points:
    before_stabilizers:
      label: До стабилизаторов
      entities:
        phase_a: sensor.power_monitor_voltage_a
        phase_b: sensor.power_monitor_voltage_b
        phase_c: sensor.power_monitor_voltage_c
        power_phase_a: sensor.power_monitor_power_a
        power_phase_b: sensor.power_monitor_power_b
        power_phase_c: sensor.power_monitor_power_c
        current_phase_a: sensor.power_monitor_current_a
        current_phase_b: sensor.power_monitor_current_b
        current_phase_c: sensor.power_monitor_current_c
        total_power: sensor.power_monitor_power
        frequency: sensor.power_monitor_ac_frequency
        voltage_imbalance: sensor.power_monitor_voltage_imbalance
        meter_online: binary_sensor.power_meter_online
        phase_loss: binary_sensor.power_phase_loss
      thresholds_volts:
        unavailable: unknown_or_unavailable
        emergency: "phase_loss or U < 125 or U > 275"
        pre_emergency: "125 <= U < 135 or 265 < U <= 275"
        deviation: "135 <= U < 150"
        normal: "150 <= U <= 265"
    after_stabilizers:
      label: После стабилизаторов
      entities:
        phase_a: sensor.socket_zb_2_voltage
        phase_b: sensor.socket_zb_3_voltage
        phase_c: sensor.socket_zb_31_voltage
      binding_status: temporary_confirmed_control_points
      thresholds_volts: &quality_thresholds
        unavailable: unknown_or_unavailable
        emergency: "U < 198 or U > 242"
        significant_deviation: "198 <= U < 205 or 235 < U <= 242"
        attention: "205 <= U < 210 or 230 < U <= 235"
        normal: "210 <= U <= 230"
    non_interruptible_line:
      label: Неотключаемая линия
      discovery:
        unique_id: W0035313411160_input_voltage
        source_device: UPS Котёл
        source_integration: stark_solarpower
        entity_id_policy: discover_from_entity_registry
      thresholds_volts: *quality_thresholds
  semantics:
    unknown_is_healthy: false
    unavailable_is_healthy: false
    missing_entity_is_healthy: false
    frontend_must_not_invent_values: true
    frontend_must_not_invent_entity_ids: true
    related_entities_require_registry_or_live_state: true
    group_alarm_precedence: [emergency, significant, attention, unavailable, normal]
  connection_status:
    source: binary_sensor.power_meter_online
    transport: local_only
    command_capability: none
    states:
      "on": Локально
      "off": Нет связи
      unknown_or_unavailable: Нет данных
    telemetry_freshness:
      source_timestamp: last_updated
      stale_after_poll_periods: 3
      default_poll_period_seconds: 30
      current: Данные актуальны
      stale: Данные устарели
      unknown: Нет данных
  history:
    provider: home_assistant_history
    primary_transport: websocket_history_during_period
    fallback_transport: recorder_rest
    rendering: autonomous_svg
    lovelace_helpers_required: false
    single_flight_per_period: true
    cache_in_flight_and_completed_periods: true
    request_partition: per_graph
    request_concurrency: 2
    request_timeout_seconds: 60
    significant_changes_only: true
    minimal_response: true
    no_attributes: true
    periods: [24h, 7d, 30d, 12m]
    metrics: [voltage, current, power]
    excluded_metrics: [generation, produced_energy, export_energy, reverse_energy]
    terminal_states: [ready, no_records, missing_entity, recorder_unavailable]
  diagnostics:
    view: diagnostics
    include_all_enabled_state_entities_of_bound_devices: true
    excluded_command_only_domains: [automation, button, event, scene, script]
    show: [state, attributes, last_changed, last_updated, context]
    update_policy: keyed_entity_cards
    interaction: native_more_info
  artwork:
    composition: separate_layers
    room_background: frontend/assets/lider-room-background-v1.webp
    equipment_overlay: frontend/assets/lider-rack-ps22w30-v2.webp
    equipment_alpha: required
