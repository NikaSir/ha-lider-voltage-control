api_version: nikas.home-assistant/lider-panel-contract/v1
kind: LiderVoltageControlContract
metadata:
  id: lider.voltage_control
  title: LIDER
  version: 0.1.3
spec:
  read_only: true
  equipment:
    three_phase_assembly: LIDER PS22W-30
    phase_module: LIDER PS7500W-30
    module_count: 3
    rack: LIDER 9-36
    arrangement: vertically_stacked_on_communication_rack
    bypass: manual_per_phase
    apparent_power_total_kva: 22.5
    active_power_total_kw: 18
  points:
    before_stabilizers:
      label: До стабилизаторов
      entities:
        phase_a: sensor.power_monitor_voltage_a
        phase_b: sensor.power_monitor_voltage_b
        phase_c: sensor.power_monitor_voltage_c
        meter_online: binary_sensor.power_meter_online
        phase_loss: binary_sensor.power_phase_loss
      thresholds_volts:
        unavailable: unknown_or_unavailable
        emergency: "phase_loss or U < 125 or U > 275"
        pre_emergency: "125 <= U < 135 or 265 < U <= 275"
        deviation: "135 <= U < 150"
        normal: "150 <= U <= 265"
    after_stabilizers:
      label: После стабилизаторов
      entities:
        phase_a: sensor.socket_zb_2_voltage
        phase_b: sensor.socket_zb_3_voltage
        phase_c: sensor.socket_zb_31_voltage
      binding_status: temporary_confirmed_control_points
      thresholds_volts: &quality_thresholds
        unavailable: unknown_or_unavailable
        emergency: "U < 198 or U > 242"
        significant_deviation: "198 <= U < 205 or 235 < U <= 242"
        attention: "205 <= U < 210 or 230 < U <= 235"
        normal: "210 <= U <= 230"
    non_interruptible_line:
      label: Неотключаемая линия
      entities:
        voltage: sensor.socket_zb_25_voltage
      thresholds_volts: *quality_thresholds
  semantics:
    unknown_is_healthy: false
    unavailable_is_healthy: false
    missing_entity_is_healthy: false
    frontend_must_not_invent_values: true
  artwork:
    composition: separate_layers
    room_background: frontend/assets/lider-room-background-v1.webp
    equipment_overlay: frontend/assets/lider-rack-ps22w30-v1.png
    equipment_alpha: required
